# Local development only. These public demo credentials must not be used in production.
# Run `docker compose up -d` here; minio-init creates the evidence bucket once.
name: axis-engine-local

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: axis_db
      POSTGRES_USER: axis
      POSTGRES_PASSWORD: axis
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axis -d axis_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -ec
      - |
        attempts=0
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          attempts=$$((attempts + 1))
          if [ "$$attempts" -ge 30 ]; then
            echo "MinIO did not become ready within 60 seconds." >&2
            exit 1
          fi
          sleep 2
        done
        mc mb --ignore-existing local/axis-evidence
        mc anonymous set none local/axis-evidence
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data:
